# Naziv aplikacije
spring.application.name=raf-lms-server

# MySQL konekcija (promenljive okruženja ili .env ih mogu zameniti)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/raf_lms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
# create-drop: tabele se prave pri startu i brišu pri gašenju (razvoj)
# validate: samo proverava da tabele odgovaraju klasama (tabele iz database/01_create_tables.sql)
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Slanje fajlova (zip zadataka i rešenja); podrazumevano je samo 1 MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
app.storage.root=${STORAGE_ROOT:./storage}
