spring.application.name=raf-lms-server

# MySQL (XAMPP: korisnik root, prazna lozinka)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/raf_lms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# create-drop: razvoj (tabele iz entiteta, Seeder puni)
# validate: provera nad tabelama iz database/01_create_tables.sql
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Slanje fajlova (zip zadataka i rešenja); podrazumevano je samo 1 MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
app.storage.root=${STORAGE_ROOT:./storage}

# JWT: ključ mora imati najmanje 32 znaka; prava vrednost ide u .env
app.security.jwt-secret=${JWT_SECRET}

# Probni podaci (Seeder)
app.seed.enabled=${SEED_ENABLED:true}

# CORS: adrese veb aplikacije (React/Angular/Vue u razvoju)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}